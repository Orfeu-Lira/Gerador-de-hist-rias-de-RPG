name: Mesa security review

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript parses
        run: |
          node --check server.js
          node --check ia.js
          node --check public/app.js
          node --check public/dice-rules.js
          node --check public/mesa-dice-audio.js
      - name: Verify dice math (criticals, modifiers and advantage)
        run: node tests/dice-rules.test.cjs
      - name: Check protected source files
        run: node tests/security-static.mjs
      - name: Validate two-account test syntax without executing it
        run: node --check tests/security-two-accounts.mjs
      - name: Validate anonymous API smoke test syntax
        run: node --check tests/security-smoke.mjs
  anonymous-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Non-destructive GET checks on public API
        env:
          MESA_BASE_URL: https://historiasrpg.vercel.app
        run: node tests/security-smoke.mjs
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependency manifest for audit
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
