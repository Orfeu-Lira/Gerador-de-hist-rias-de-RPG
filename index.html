<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa – ferramentas para mestres de RPG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Mesa</h1>
    <nav id="nav" aria-label="Principal"></nav>
  </header>
  <p id="aviso" role="status"></p>

  <!-- Gerador: qualquer visitante vê; o servidor aplica os limites -->
  <section id="v-gerador">
    <form id="f-gerar" class="folha">
      <div class="grade">
        <div><label for="genero">Gênero</label><select id="genero"></select></div>
        <div><label for="tom">Tom</label><select id="tom"></select></div>
        <div><label for="jogadores">Jogadores</label><input id="jogadores" type="number" min="1" max="20" value="4" required></div>
      </div>
      <label for="ideia">Ideia extra (opcional)</label>
      <input id="ideia" type="text" maxlength="200" placeholder="Ex.: a história começa em uma taverna à beira de um lago">
      <p class="acoes"><button class="principal" id="b-gerar" type="submit">Gerar aventura</button> <span id="info" class="suave"></span></p>
    </form>
    <div id="saida"></div>
  </section>

  <section id="v-dados" hidden>
    <div class="folha">
      <label for="qtd">Quantidade de dados</label>
      <input id="qtd" type="number" min="1" max="20" value="1" class="curto">
      <div class="acoes" id="dados"></div>
      <p class="resultado" id="total" aria-live="polite">–</p>
      <p class="suave" id="detalhe"></p>
      <p class="suave" id="info-dados"></p>
    </div>
  </section>

  <section id="v-historico" hidden>
    <div id="lista"></div>
    <div id="saida-hist"></div>
  </section>

  <section id="v-conta" hidden>
    <form id="f-login" class="folha estreita">
      <h2>Entrar</h2>
      <label for="l-email">E-mail</label>
      <input id="l-email" type="email" autocomplete="email" required>
      <label for="l-senha">Senha</label>
      <input id="l-senha" type="password" autocomplete="current-password" required>
      <p class="acoes"><button class="principal" type="submit">Entrar</button></p>
      <p class="suave">Não tem conta? <button type="button" class="link" id="ir-cadastro">Criar conta</button></p>
    </form>
    <form id="f-cadastro" class="folha estreita" hidden>
      <h2>Criar conta</h2>
      <label for="c-email">E-mail</label>
      <input id="c-email" type="email" autocomplete="email" required>
      <label for="c-senha">Senha</label>
      <input id="c-senha" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      <p class="suave">Mínimo de 8 caracteres.</p>
      <p class="acoes"><button class="principal" type="submit">Criar conta</button></p>
      <p class="suave">Já tem conta? <button type="button" class="link" id="ir-login">Entrar</button></p>
    </form>
  </section>

  <section id="v-admin" hidden>
    <div class="folha" id="resumo"></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
